# Design example, not executable until the runtime and local locks exist.
schema_version: "0.1"
status: design_example
experiment_id: E01
phase: P1
seed: 0
network_enabled: false
paid_api_enabled: false
hardware_enabled: false

environment:
  adapter: robosuite
  task: Lift
  robot: Panda
  observation_regime: state
  rendering: false
  control_hz: 20
  episode_control_ticks: 500
  success_metric: native_ever_success
  timing_mode: paused_simulation
  dependency_lock: null  # Mandatory for real runs.
  asset_manifest: null
  initial_state_manifest: null

control:
  composite_controller: BASIC
  arm_controller: OSC_POSE
  controller_contract: null  # Generated by direction/gripper/scale tests.
  units: SI
  canonical_frame: robot_base
  quaternion_order: xyzw
  planned_steps: 8
  execution_steps: 4
  operational_profile: null  # Required workspace and motion bounds; no guessed defaults.

proposal:
  name: local_lattice_plus_phase_target
  max_candidates: 16
  translation_magnitudes_m: [0.01, 0.03]
  fixed_orientation: true
  include_hold: true
  include_grip_only: true
  include_phase_target: true
  deduplicate: true
  shuffle_presentation: true

scoring:
  name: geometric_phase
  heuristic_parameters: null  # Tune on pilot states and freeze before test.
selection:
  rule: masked_argmax
  tie_break: canonical_candidate_id
  max_reproposals: 1
  reproposal_max_candidates: 32
  on_exhausted: abort

diagnostics:
  enabled: false  # Separate process/capability; never visible to the scorer.
  max_snapshots: 100
  candidate_repeats: 1
  continuation_steps: 40
  continuation_revision: null

splits:
  task_local_seed_ranges_inclusive:
    train: [0, 999]
    validation: [1000, 1199]
    calibration: [1200, 1399]
    test_id: [2000, 2299]
    test_ood: [3000, 3299]
  pilot: [0, 49]
  freeze_manifest_before_test: true
logging:
  root: runs
  format: jsonl
  hash_artifacts: true
  redact_secrets: true
